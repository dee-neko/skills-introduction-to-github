<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>応募の5ステップ</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Roboto:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; }
        .font-accent { font-family: 'Roboto', sans-serif; }
        .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; }
        .bg-brand-dark { background-color: #1e3a5f; }
        .bg-brand-accent { background-color: #0066cc; }
        .bg-brand-warm { background-color: #f59e0b; }
        .text-brand-dark { color: #1e3a5f; }
        .text-brand-accent { color: #0066cc; }
        .text-brand-warm { color: #f59e0b; }
        .border-brand-accent { border-color: #0066cc; }
        .border-brand-warm { border-color: #f59e0b; }
    </style>
</head>
<body>
    <div class="slide flex flex-col">
        <div class="bg-brand-dark px-16 py-6">
            <p class="text-xs uppercase tracking-widest text-blue-300 mb-1 font-accent">Application Process</p>
            <h1 class="text-3xl font-bold text-white">応募の5ステップ</h1>
        </div>
        <div class="flex-1 px-16 py-12">
            <div class="grid grid-cols-5 gap-6 h-full">
                <div class="flex flex-col items-center">
                    <div class="w-20 h-20 bg-brand-accent rounded-full flex items-center justify-center text-white font-black font-accent text-3xl mb-4">1</div>
                    <div class="flex-1 bg-blue-50 rounded-lg p-4 text-center">
                        <h2 class="text-lg font-bold text-brand-dark mb-3">登録準備</h2>
                        <p class="text-sm text-gray-600 leading-relaxed mb-2">Grants.govアカウント作成</p>
                        <p class="text-xs text-gray-500">DUNS番号取得、SAM登録完了</p>
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-20 h-20 bg-brand-accent rounded-full flex items-center justify-center text-white font-black font-accent text-3xl mb-4">2</div>
                    <div class="flex-1 bg-blue-50 rounded-lg p-4 text-center">
                        <h2 class="text-lg font-bold text-brand-dark mb-3">プログラム選択</h2>
                        <p class="text-sm text-gray-600 leading-relaxed mb-2">FOA確認</p>
                        <p class="text-xs text-gray-500">研究分野とプログラムの適合性を評価</p>
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-20 h-20 bg-brand-accent rounded-full flex items-center justify-center text-white font-black font-accent text-3xl mb-4">3</div>
                    <div class="flex-1 bg-blue-50 rounded-lg p-4 text-center">
                        <h2 class="text-lg font-bold text-brand-dark mb-3">書類作成</h2>
                        <p class="text-sm text-gray-600 leading-relaxed mb-2">提案書執筆</p>
                        <p class="text-xs text-gray-500">予算計画、CVs、支援レター準備</p>
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-20 h-20 bg-brand-accent rounded-full flex items-center justify-center text-white font-black font-accent text-3xl mb-4">4</div>
                    <div class="flex-1 bg-blue-50 rounded-lg p-4 text-center">
                        <h2 class="text-lg font-bold text-brand-dark mb-3">提出</h2>
                        <p class="text-sm text-gray-600 leading-relaxed mb-2">電子提出</p>
                        <p class="text-xs text-gray-500">締切厳守、受領確認メール確認</p>
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-20 h-20 bg-brand-warm rounded-full flex items-center justify-center text-white font-black font-accent text-3xl mb-4">5</div>
                    <div class="flex-1 bg-amber-50 rounded-lg p-4 text-center">
                        <h2 class="text-lg font-bold text-brand-dark mb-3">審査・採択</h2>
                        <p class="text-sm text-gray-600 leading-relaxed mb-2">ピアレビュー</p>
                        <p class="text-xs text-gray-500">6～9ヶ月後に通知、契約交渉開始</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="px-16 py-4 border-t border-gray-200 flex justify-between items-center">
            <p class="text-xs text-gray-500">FY 2026 Office of Science Financial Assistance Program</p>
            <p class="text-xs text-gray-400 font-accent">11</p>
        </div>
    </div>
</body>
</html>
