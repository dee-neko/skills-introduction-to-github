<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Section 1: プログラム概要</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Roboto:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; }
        .font-accent { font-family: 'Roboto', sans-serif; }
        .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; }
        .bg-brand-dark { background-color: #1e3a5f; }
        .bg-brand-accent { background-color: #0066cc; }
        .bg-brand-warm { background-color: #f59e0b; }
        .text-brand-dark { color: #1e3a5f; }
        .text-brand-accent { color: #0066cc; }
        .text-brand-warm { color: #f59e0b; }
        .border-brand-accent { border-color: #0066cc; }
        .border-brand-warm { border-color: #f59e0b; }
    </style>
</head>
<body>
    <div class="slide flex">
        <div class="w-1/3 bg-brand-dark flex flex-col items-center justify-center p-12">
            <p class="text-9xl font-black text-brand-accent opacity-20 font-accent mb-4">01</p>
            <i class="fas fa-flask text-white text-5xl mb-6"></i>
        </div>
        <div class="w-2/3 flex flex-col justify-center px-16 py-12">
            <p class="text-xs uppercase tracking-widest text-gray-400 mb-2 font-accent">Section 1</p>
            <h1 class="text-4xl font-black text-brand-dark mb-6">プログラム概要</h1>
            <p class="text-lg text-gray-700 leading-relaxed mb-4">DOE Office of Scienceの研究助成プログラムは、基礎科学研究の推進を通じて、エネルギー・環境・国家安全保障分野における重要課題の解決を目指しています。</p>
            <p class="text-base text-gray-600 leading-relaxed">FY 2026年度も、大学・研究機関・民間企業を対象に、革新的な研究プロジェクトへの資金提供を継続します。</p>
        </div>
    </div>
</body>
</html>
