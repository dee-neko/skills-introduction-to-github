<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Office of Scienceのミッション</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Roboto:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; }
        .font-accent { font-family: 'Roboto', sans-serif; }
        .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; }
        .bg-brand-dark { background-color: #1e3a5f; }
        .bg-brand-accent { background-color: #0066cc; }
        .bg-brand-warm { background-color: #f59e0b; }
        .text-brand-dark { color: #1e3a5f; }
        .text-brand-accent { color: #0066cc; }
        .text-brand-warm { color: #f59e0b; }
        .border-brand-accent { border-color: #0066cc; }
        .border-brand-warm { border-color: #f59e0b; }
    </style>
</head>
<body>
    <div class="slide flex flex-col">
        <div class="bg-brand-dark px-16 py-6">
            <p class="text-xs uppercase tracking-widest text-blue-300 mb-1 font-accent">Our Mission</p>
            <h1 class="text-3xl font-bold text-white">Office of Scienceのミッション</h1>
        </div>
        <div class="flex-1 px-16 py-12">
            <div class="flex gap-8 h-full">
                <div class="w-1/2 flex flex-col">
                    <div class="bg-gradient-to-br from-blue-50 to-blue-100 p-8 rounded-lg border-l-4 border-brand-accent h-full flex flex-col">
                        <i class="fas fa-lightbulb text-brand-accent text-4xl mb-4"></i>
                        <h2 class="text-2xl font-bold text-brand-dark mb-4">基礎科学研究の推進</h2>
                        <p class="text-base text-gray-700 leading-relaxed mb-3">物理学、化学、生物学、材料科学など、幅広い分野における基礎研究を支援</p>
                        <p class="text-sm text-gray-600 leading-relaxed">革新的な発見と技術開発の基盤を構築し、次世代の科学的ブレークスルーを実現</p>
                    </div>
                </div>
                <div class="w-1/2 flex flex-col">
                    <div class="bg-gradient-to-br from-amber-50 to-orange-100 p-8 rounded-lg border-l-4 border-brand-warm h-full flex flex-col">
                        <i class="fas fa-globe-americas text-brand-warm text-4xl mb-4"></i>
                        <h2 class="text-2xl font-bold text-brand-dark mb-4">社会課題の解決</h2>
                        <p class="text-base text-gray-700 leading-relaxed mb-3">エネルギー安全保障、気候変動、環境保護、国家安全保障に貢献</p>
                        <p class="text-sm text-gray-600 leading-relaxed">科学的知見を実社会の課題解決に応用し、持続可能な未来を創造</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="px-16 py-4 border-t border-gray-200 flex justify-between items-center">
            <p class="text-xs text-gray-500">FY 2026 Office of Science Financial Assistance Program</p>
            <p class="text-xs text-gray-400 font-accent">04</p>
        </div>
    </div>
</body>
</html>
