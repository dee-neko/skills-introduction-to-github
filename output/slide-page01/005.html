<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>主要研究分野</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Roboto:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; }
        .font-accent { font-family: 'Roboto', sans-serif; }
        .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; }
        .bg-brand-dark { background-color: #1e3a5f; }
        .bg-brand-accent { background-color: #0066cc; }
        .bg-brand-warm { background-color: #f59e0b; }
        .text-brand-dark { color: #1e3a5f; }
        .text-brand-accent { color: #0066cc; }
        .text-brand-warm { color: #f59e0b; }
        .border-brand-accent { border-color: #0066cc; }
        .border-brand-warm { border-color: #f59e0b; }
    </style>
</head>
<body>
    <div class="slide flex flex-col">
        <div class="bg-brand-dark px-16 py-6">
            <p class="text-xs uppercase tracking-widest text-blue-300 mb-1 font-accent">Key Research Areas</p>
            <h1 class="text-3xl font-bold text-white">主要研究分野</h1>
        </div>
        <div class="flex-1 px-16 py-12">
            <div class="grid grid-cols-3 gap-8 h-full">
                <div class="bg-white p-6 rounded-lg shadow-lg border-t-4 border-brand-accent flex flex-col">
                    <i class="fas fa-atom text-brand-accent text-4xl mb-4"></i>
                    <h2 class="text-xl font-bold text-brand-dark mb-3">高エネルギー物理学</h2>
                    <p class="text-sm text-gray-600 leading-relaxed mb-2">素粒子物理学、宇宙の起源研究</p>
                    <p class="text-xs text-gray-500 leading-relaxed">加速器科学、暗黒物質探査、ニュートリノ研究</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-lg border-t-4 border-brand-accent flex flex-col">
                    <i class="fas fa-solar-panel text-brand-accent text-4xl mb-4"></i>
                    <h2 class="text-xl font-bold text-brand-dark mb-3">エネルギー科学</h2>
                    <p class="text-sm text-gray-600 leading-relaxed mb-2">再生可能エネルギー、核融合研究</p>
                    <p class="text-xs text-gray-500 leading-relaxed">太陽光発電、エネルギー貯蔵、クリーンエネルギー技術</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-lg border-t-4 border-brand-accent flex flex-col">
                    <i class="fas fa-dna text-brand-accent text-4xl mb-4"></i>
                    <h2 class="text-xl font-bold text-brand-dark mb-3">生物・環境科学</h2>
                    <p class="text-sm text-gray-600 leading-relaxed mb-2">ゲノム科学、気候変動研究</p>
                    <p class="text-xs text-gray-500 leading-relaxed">バイオエネルギー、炭素循環、環境修復技術</p>
                </div>
            </div>
        </div>
        <div class="px-16 py-4 border-t border-gray-200 flex justify-between items-center">
            <p class="text-xs text-gray-500">FY 2026 Office of Science Financial Assistance Program</p>
            <p class="text-xs text-gray-400 font-accent">05</p>
        </div>
    </div>
</body>
</html>
