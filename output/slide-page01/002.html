<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Agenda</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Roboto:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; }
        .font-accent { font-family: 'Roboto', sans-serif; }
        .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; }
        .bg-brand-dark { background-color: #1e3a5f; }
        .bg-brand-accent { background-color: #0066cc; }
        .bg-brand-warm { background-color: #f59e0b; }
        .text-brand-dark { color: #1e3a5f; }
        .text-brand-accent { color: #0066cc; }
        .text-brand-warm { color: #f59e0b; }
        .border-brand-accent { border-color: #0066cc; }
        .border-brand-warm { border-color: #f59e0b; }
    </style>
</head>
<body>
    <div class="slide flex flex-col">
        <div class="bg-brand-dark px-16 py-6">
            <p class="text-xs uppercase tracking-widest text-blue-300 mb-1 font-accent">Agenda</p>
            <h1 class="text-3xl font-bold text-white">本日の内容</h1>
        </div>
        <div class="flex-1 px-16 py-12 flex items-center">
            <div class="w-full space-y-6">
                <div class="flex items-center p-6 bg-blue-50 rounded-lg border-l-4 border-brand-accent">
                    <div class="w-12 h-12 bg-brand-accent rounded-full flex items-center justify-center text-white font-black font-accent text-xl mr-6">1</div>
                    <p class="text-xl font-bold text-brand-dark">プログラム概要</p>
                </div>
                <div class="flex items-center p-6 bg-blue-50 rounded-lg border-l-4 border-brand-accent">
                    <div class="w-12 h-12 bg-brand-accent rounded-full flex items-center justify-center text-white font-black font-accent text-xl mr-6">2</div>
                    <p class="text-xl font-bold text-brand-dark">対象分野と助成領域</p>
                </div>
                <div class="flex items-center p-6 bg-blue-50 rounded-lg border-l-4 border-brand-accent">
                    <div class="w-12 h-12 bg-brand-accent rounded-full flex items-center justify-center text-white font-black font-accent text-xl mr-6">3</div>
                    <p class="text-xl font-bold text-brand-dark">応募要件とプロセス</p>
                </div>
                <div class="flex items-center p-6 bg-blue-50 rounded-lg border-l-4 border-brand-accent">
                    <div class="w-12 h-12 bg-brand-accent rounded-full flex items-center justify-center text-white font-black font-accent text-xl mr-6">4</div>
                    <p class="text-xl font-bold text-brand-dark">審査基準と資金配分</p>
                </div>
            </div>
        </div>
        <div class="px-16 py-4 border-t border-gray-200 flex justify-between items-center">
            <p class="text-xs text-gray-500">FY 2026 Office of Science Financial Assistance Program</p>
            <p class="text-xs text-gray-400 font-accent">02</p>
        </div>
    </div>
</body>
</html>
