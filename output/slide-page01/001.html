<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>FY 2026 DOE Office of Science Financial Assistance Program</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Roboto:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; }
        .font-accent { font-family: 'Roboto', sans-serif; }
        .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; }
        .bg-brand-dark { background-color: #1e3a5f; }
        .bg-brand-accent { background-color: #0066cc; }
        .bg-brand-warm { background-color: #f59e0b; }
        .text-brand-dark { color: #1e3a5f; }
        .text-brand-accent { color: #0066cc; }
        .text-brand-warm { color: #f59e0b; }
        .border-brand-accent { border-color: #0066cc; }
        .border-brand-warm { border-color: #f59e0b; }
    </style>
</head>
<body>
    <div class="slide flex flex-col items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-50">
        <i class="fas fa-flask text-brand-accent text-6xl mb-8 opacity-80"></i>
        <p class="text-xs uppercase tracking-widest text-gray-500 mb-2 font-accent">U.S. Department of Energy</p>
        <h1 class="text-5xl font-black text-brand-dark mb-4 text-center px-12">FY 2026 継続公募</h1>
        <h2 class="text-2xl font-bold text-brand-accent mb-8 text-center px-12">Office of Science 研究助成プログラム概要</h2>
        <p class="text-sm text-gray-600 font-accent mt-8">Fiscal Year 2026</p>
        <p class="text-xs text-gray-500 mt-2">Continuation of Solicitation for Financial Assistance</p>
    </div>
</body>
</html>
