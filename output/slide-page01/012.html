<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>応募資格</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Roboto:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; }
        .font-accent { font-family: 'Roboto', sans-serif; }
        .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; }
        .bg-brand-dark { background-color: #1e3a5f; }
        .bg-brand-accent { background-color: #0066cc; }
        .bg-brand-warm { background-color: #f59e0b; }
        .text-brand-dark { color: #1e3a5f; }
        .text-brand-accent { color: #0066cc; }
        .text-brand-warm { color: #f59e0b; }
        .border-brand-accent { border-color: #0066cc; }
        .border-brand-warm { border-color: #f59e0b; }
    </style>
</head>
<body>
    <div class="slide flex flex-col">
        <div class="bg-brand-dark px-16 py-6">
            <p class="text-xs uppercase tracking-widest text-blue-300 mb-1 font-accent">Eligibility</p>
            <h1 class="text-3xl font-bold text-white">応募資格</h1>
        </div>
        <div class="flex-1 px-16 py-12">
            <div class="flex gap-8 h-full">
                <div class="w-1/2 flex flex-col">
                    <div class="bg-gradient-to-br from-blue-50 to-blue-100 p-8 rounded-lg border-l-4 border-brand-accent flex-1">
                        <i class="fas fa-university text-brand-accent text-4xl mb-4"></i>
                        <h2 class="text-2xl font-bold text-brand-dark mb-6">対象機関</h2>
                        <div class="space-y-3">
                            <div class="flex items-start">
                                <i class="fas fa-check text-brand-accent mr-3 mt-1"></i>
                                <p class="text-base text-gray-700">米国内の大学・カレッジ</p>
                            </div>
                            <div class="flex items-start">
                                <i class="fas fa-check text-brand-accent mr-3 mt-1"></i>
                                <p class="text-base text-gray-700">国立研究所・DOE施設</p>
                            </div>
                            <div class="flex items-start">
                                <i class="fas fa-check text-brand-accent mr-3 mt-1"></i>
                                <p class="text-base text-gray-700">非営利研究機関</p>
                            </div>
                            <div class="flex items-start">
                                <i class="fas fa-check text-brand-accent mr-3 mt-1"></i>
                                <p class="text-base text-gray-700">民間企業（条件付き）</p>
                            </div>
                            <div class="flex items-start">
                                <i class="fas fa-check text-brand-accent mr-3 mt-1"></i>
                                <p class="text-base text-gray-700">州・地方政府機関</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="w-1/2 flex flex-col">
                    <div class="bg-gradient-to-br from-indigo-50 to-purple-100 p-8 rounded-lg border-l-4 border-brand-accent flex-1">
                        <i class="fas fa-user-tie text-brand-accent text-4xl mb-4"></i>
                        <h2 class="text-2xl font-bold text-brand-dark mb-6">研究責任者（PI）要件</h2>
                        <div class="space-y-3">
                            <div class="flex items-start">
                                <i class="fas fa-check text-brand-accent mr-3 mt-1"></i>
                                <p class="text-base text-gray-700">博士号（Ph.D.）保持者</p>
                            </div>
                            <div class="flex items-start">
                                <i class="fas fa-check text-brand-accent mr-3 mt-1"></i>
                                <p class="text-base text-gray-700">所属機関の正式な雇用関係</p>
                            </div>
                            <div class="flex items-start">
                                <i class="fas fa-check text-brand-accent mr-3 mt-1"></i>
                                <p class="text-base text-gray-700">米国市民または永住権保持者</p>
                            </div>
                            <div class="flex items-start">
                                <i class="fas fa-check text-brand-accent mr-3 mt-1"></i>
                                <p class="text-base text-gray-700">過去の研究実績・論文発表</p>
                            </div>
                            <div class="flex items-start">
                                <i class="fas fa-check text-brand-accent mr-3 mt-1"></i>
                                <p class="text-base text-gray-700">利益相反がないこと</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="px-16 py-4 border-t border-gray-200 flex justify-between items-center">
            <p class="text-xs text-gray-500">FY 2026 Office of Science Financial Assistance Program</p>
            <p class="text-xs text-gray-400 font-accent">12</p>
        </div>
    </div>
</body>
</html>
